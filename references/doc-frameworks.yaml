# Documentation Framework Catalog
# The architect recommends a framework based on the library's ecosystem, existing
# configuration, and the characteristics below. Frameworks are sorted by
# modernization bias: recent activity, community size, and build speed are favored.

ecosystems:
  python:
    label: Python ecosystem
    frameworks:
      zensical:
        type: Static site generator, Python-native
        auto_gen_api: true
        notebook_support: false
        build_speed: Fast (Rust)
        config_file: zensical.toml
        best_for: Python libraries and packages
        experience: "★★★"
        note: Successor to mkdocs-material; modern, fast.
        commands:
          - label: Build
            cmd: zensical build
          - label: Serve
            cmd: zensical serve
          - label: Publish
            cmd: zensical publish

      mkdocs-material:
        type: Static site generator (MkDocs plugin)
        auto_gen_api: true
        auto_gen_api_note: Via mkdocstrings plugin
        notebook_support: true
        notebook_support_note: Via mkdocs-jupyter plugin
        build_speed: Fast (Python)
        config_file: mkdocs.yml
        best_for: Python libraries; mature ecosystem, extensive themes
        experience: "★★★"
        note: Predecessor to zensical. Very mature plugin ecosystem.
        commands:
          - label: Build
            cmd: mkdocs build
          - label: Serve
            cmd: mkdocs serve
          - label: Publish to Pages
            cmd: mkdocs gh-deploy

      Sphinx:
        type: Documentation generator
        auto_gen_api: true
        auto_gen_api_note: autodoc, autosummary
        notebook_support: true
        notebook_support_note: Via nbsphinx plugin
        build_speed: Moderate to slow
        config_file: docs/conf.py or source/conf.py
        best_for: Large Python projects, projects needing PDF/LaTeX output
        experience: "★★"
        note: Oldest and most feature-complete, but slow and complex. Default on ReadTheDocs.
        commands:
          - label: Build (HTML)
            cmd: sphinx-build -b html source/ build/
          - label: Build (PDF)
            cmd: sphinx-build -b latex source/ build/latex/ && make -C build/latex/
          - label: Serve
            cmd: python -m http.server -d build/
          - label: Publish
            cmd: push to branch — ReadTheDocs auto-builds on webhook

      pdoc:
        type: API documentation generator
        auto_gen_api: true
        notebook_support: false
        build_speed: Very fast
        config_file: pyproject.toml ([tool.pdoc])
        best_for: Small-to-medium Python libraries that just need clean API docs
        experience: "★"
        note: Not a full site generator — just API reference. Pair with hand-written tutorials/how-tos elsewhere.
        commands:
          - label: Build
            cmd: pdoc --html --output-dir docs/ my_package
          - label: Serve
            cmd: pdoc --http : my_package

      MyST-MD:
        type: Markdown-based documentation framework (JupyterBook ecosystem)
        auto_gen_api: true
        auto_gen_api_note: Via sphinx-autodoc or custom scripts
        notebook_support: true
        notebook_support_note: Native (MyST-NB)
        build_speed: Moderate
        config_file: myst.yml
        best_for: IPython/Jupyter-heavy projects, computational narratives
        experience: "★★★"
        note: Excellent for projects where documentation is notebook-first.
        commands:
          - label: Build (HTML)
            cmd: myst build --html
          - label: Build (PDF)
            cmd: myst build --pdf
          - label: Serve
            cmd: myst start

      Quarto:
        type: Multi-language scientific/technical publishing system
        auto_gen_api: false
        notebook_support: true
        notebook_support_note: Native (.ipynb, .qmd)
        build_speed: Moderate
        config_file: _quarto.yml
        best_for: Computational projects, data science, multi-language docs
        note: Strongest for mixed prose+code documents. Cross-language (Python, R, Julia, Observable). Can render to websites, PDFs, presentations.
        experience: "★★★"
        commands:
          - label: Render
            cmd: quarto render
          - label: Preview
            cmd: quarto preview
          - label: Render to PDF
            cmd: quarto render --to pdf

  rust:
    label: Rust ecosystem
    frameworks:
      mdBook:
        type: Book-style documentation generator
        auto_gen_api: false
        notebook_support: false
        build_speed: Very fast (Rust)
        config_file: book.toml
        best_for: Hand-written guides, tutorials, books
        experience: "★"
        note: The standard for non-API documentation in Rust. Usually paired with rustdoc for API reference.
        commands:
          - label: Build
            cmd: mdbook build
          - label: Serve
            cmd: mdbook serve --open
          - label: Publish
            cmd: mdbook build then deploy book/ directory

      rustdoc:
        type: API documentation generator (built into Rust toolchain)
        auto_gen_api: true
        notebook_support: false
        build_speed: Fast (compiles with cargo doc)
        config_file: Cargo.toml ([package.metadata.docs.rs])
        best_for: All Rust crates — reference docs are universally auto-generated
        experience: "★"
        note: Not a full site generator. Always pair with mdBook or hand-written guides for tutorials/how-tos.
        commands:
          - label: Build
            cmd: cargo doc --no-deps
          - label: Publish
            cmd: push to crates.io — docs.rs auto-builds on publish

  javascript:
    label: JavaScript/TypeScript ecosystem
    frameworks:
      Docusaurus:
        type: React-based static site generator
        auto_gen_api: true
        auto_gen_api_note: Via plugins (TypeDoc, etc.)
        notebook_support: false
        build_speed: Moderate (webpack/bundler overhead)
        config_file: docusaurus.config.js
        best_for: JS/TS projects, projects with multiple doc versions
        experience: "★"
        note: Strong versioning support. Default for many Meta projects. Heavy build pipeline.
        commands:
          - label: Build
            cmd: npm run build (or yarn build)
          - label: Serve
            cmd: npm run start (or yarn start)
          - label: Publish to Pages
            cmd: GIT_USER=<user> yarn deploy

      VitePress:
        type: Vite-powered static site generator
        auto_gen_api: true
        auto_gen_api_note: Via plugins
        notebook_support: false
        build_speed: Very fast (Vite)
        config_file: .vitepress/config.js or .vitepress/config.ts
        best_for: JS/TS projects, modern and fast
        experience: "★"
        note: Faster builds, simpler config than Docusaurus. Vue ecosystem origins but framework-agnostic for docs.
        commands:
          - label: Build
            cmd: npm run docs:build
          - label: Serve
            cmd: npm run docs:dev
          - label: Publish
            cmd: npm run docs:build then deploy docs/.vitepress/dist

      TypeDoc:
        type: API documentation generator
        auto_gen_api: true
        notebook_support: false
        build_speed: Fast
        config_file: typedoc.json
        best_for: TypeScript projects needing API reference
        experience: "★"
        note: Not a full site generator. Pair with VitePress or Docusaurus.
        commands:
          - label: Build
            cmd: npx typedoc

  language-agnostic:
    label: Language-agnostic
    frameworks:
      GitBook:
        type: Hosted documentation platform
        auto_gen_api: false
        notebook_support: false
        notebook_support_note: Limited
        build_speed: N/A (hosted)
        config_file: SUMMARY.md
        best_for: Teams wanting zero-config hosted docs
        experience: "★"
        note: Hosted service. Can import from GitHub repos. Good for non-technical teams.

      GitHub Wiki:
        type: Git-backed wiki
        auto_gen_api: false
        notebook_support: false
        build_speed: N/A (hosted)
        config_file: None (per-repo wiki)
        best_for: Minimal setup, internal docs
        experience: "★"
        note: Only for very small projects. No Diataxis structure support. Clones as a separate git repo.

# Detection quick-reference: config file patterns → framework name
detection:
  - config: SConstruct + zensical.toml
    framework: zensical
  - config: mkdocs.yml
    framework: mkdocs / mkdocs-material
  - config: _quarto.yml
    framework: Quarto
  - config: myst.yml
    framework: MyST-MD
  - config: docs/conf.py or source/conf.py
    framework: Sphinx
  - config: book.toml
    framework: mdBook
  - config: docusaurus.config.js
    framework: Docusaurus
  - config: .vitepress/config.js or .vitepress/config.ts
    framework: VitePress
  - config: typedoc.json
    framework: TypeDoc
  - config: pyproject.toml ([tool.pdoc])
    framework: pdoc
  - config: Cargo.toml ([package.metadata.docs.rs])
    framework: rustdoc
  - config: SUMMARY.md
    framework: GitBook

# Adding frameworks ad hoc
notes:
  adding: |
    The user can add frameworks to this catalog at any time. When adding:
    - Note the ecosystem, config file pattern, and detection method
    - Add to the detection quick-reference entries
    - Tag with experience tier (★★★ = strong personal experience, ★ = catalog entry only)
